version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot updates them while
  # keeping the pin, so pinning does not mean going stale. The repository has no
  # other dependency manifest: the MATLAB code uses base MATLAB only.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
